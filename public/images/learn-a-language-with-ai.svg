    <path d="M572 504 a18 18 0 0 0 36 0 M590 522 v8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <rect x="730" y="70" width="360" height="220" rx="24" fill="#fff" stroke="#bfe3cf" stroke-width="4"/>
